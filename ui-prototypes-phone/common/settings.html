<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 - 智健联盟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* iPhone 15 Pro 设备框架 */
        .device-frame {
            width: 393px;
            height: 852px;
            background: #1d1d1f;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .device-screen {
            width: 100%;
            height: 100%;
            background: #f2f2f7;
            border-radius: 47px;
            overflow: hidden;
            position: relative;
        }

        /* iOS 状态栏 */
        .status-bar {
            height: 54px;
            background: linear-gradient(180deg, rgba(242,242,247,0.95) 0%, rgba(242,242,247,0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            padding-top: 10px;
            position: relative;
            z-index: 50;
        }

        .status-bar-time {
            font-size: 15px;
            font-weight: 600;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .status-bar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar-icon {
            font-size: 16px;
            color: #000000;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000000;
            border-radius: 19px;
            z-index: 100;
        }

        /* 内容区域 */
        .content {
            height: calc(100% - 54px - 83px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 底部 Tab Bar */
        .tab-bar {
            height: 83px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 8px;
            position: relative;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-item.active .tab-icon {
            color: #007AFF;
        }

        .tab-item.active .tab-label {
            color: #007AFF;
        }

        .tab-icon {
            font-size: 24px;
            color: #8e8e93;
        }

        .tab-label {
            font-size: 10px;
            color: #8e8e93;
            font-weight: 500;
        }

        /* 个人信息卡片 */
        .profile-card {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 20px;
            padding: 24px;
            color: white;
            margin: 16px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            margin-bottom: 16px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 功能列表 */
        .feature-list {
            background: white;
            border-radius: 16px;
            margin: 16px;
            overflow: hidden;
        }

        .feature-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
            transition: all 0.2s;
            cursor: pointer;
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-item:hover {
            background: #f8fafc;
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 16px;
        }

        .feature-info {
            flex: 1;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 2px;
        }

        .feature-description {
            font-size: 13px;
            color: #6b7280;
        }

        .feature-action {
            color: #3b82f6;
            font-size: 14px;
            font-weight: 500;
        }

        /* 退出登录按钮 */
        .logout-button {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-button:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        /* 响应式 */
        @media (max-width: 430px) {
            .device-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
            }
            .device-screen {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="device-screen">
            <!-- Dynamic Island -->
            <div class="dynamic-island"></div>

            <!-- iOS 状态栏 -->
            <div class="status-bar">
                <div class="status-bar-time">9:41</div>
                <div class="status-bar-icons">
                    <i class="fas fa-signal status-bar-icon"></i>
                    <i class="fas fa-wifi status-bar-icon"></i>
                    <i class="fas fa-battery-full status-bar-icon"></i>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="content">
                <!-- 个人信息卡片 -->
                <div class="profile-card">
                    <div class="relative z-10">
                        <img src="https://i.pravatar.cc/160?img=12" class="profile-avatar mx-auto">
                        <div class="text-center">
                            <div class="profile-name">张三</div>
                            <div class="profile-info">
                                <span>高级版会员</span>
                                <span>ID: 10001</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 功能列表 -->
                <div class="feature-list">
                    <!-- 我的订阅 -->
                    <div class="feature-item" onclick="navigateTo('subscription')">
                        <div class="feature-icon bg-blue-100 text-blue-500">
                            <i class="fas fa-crown"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">我的订阅</div>
                            <div class="feature-description">高级版 · 到期：2024-11-23</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 我的教练 -->
                    <div class="feature-item" onclick="navigateTo('my-coach')">
                        <div class="feature-icon bg-green-100 text-green-500">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">我的教练</div>
                            <div class="feature-description">王教练 · 力量举专家</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 训练数据 -->
                    <div class="feature-item" onclick="navigateTo('training-data')">
                        <div class="feature-icon bg-purple-100 text-purple-500">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">训练数据</div>
                            <div class="feature-description">进度曲线 · 历史记录</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 我的档案 -->
                    <div class="feature-item" onclick="navigateTo('profile')">
                        <div class="feature-icon bg-pink-100 text-pink-500">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">我的档案</div>
                            <div class="feature-description">个人信息 · 训练历史</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 排行榜 -->
                    <div class="feature-item" onclick="navigateTo('leaderboard')">
                        <div class="feature-icon bg-yellow-100 text-yellow-500">
                            <i class="fas fa-trophy"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">排行榜</div>
                            <div class="feature-description">我的排名 · 成绩记录</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 订单历史 -->
                    <div class="feature-item" onclick="navigateTo('orders')">
                        <div class="feature-icon bg-indigo-100 text-indigo-500">
                            <i class="fas fa-receipt"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">订单历史</div>
                            <div class="feature-description">订阅记录 · 支付历史</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </div>

                <!-- 设置选项 -->
                <div class="feature-list">
                    <!-- 设置 -->
                    <div class="feature-item" onclick="navigateTo('settings')">
                        <div class="feature-icon bg-gray-100 text-gray-500">
                            <i class="fas fa-cog"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">设置</div>
                            <div class="feature-description">通知、隐私、安全设置</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 帮助与反馈 -->
                    <div class="feature-item" onclick="navigateTo('help')">
                        <div class="feature-icon bg-teal-100 text-teal-500">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">帮助与反馈</div>
                            <div class="feature-description">FAQ · 联系客服</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>

                    <!-- 关于我们 -->
                    <div class="feature-item" onclick="navigateTo('about')">
                        <div class="feature-icon bg-orange-100 text-orange-500">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="feature-info">
                            <div class="feature-title">关于我们</div>
                            <div class="feature-description">版本信息 · 服务条款</div>
                        </div>
                        <div class="feature-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </div>

                <!-- 退出登录按钮 -->
                <div class="pb-4">
                    <button class="logout-button" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        退出登录
                    </button>
                </div>
            </div>

            <!-- 底部 Tab Bar -->
            <div class="tab-bar">
                <a href="student/home.html" class="tab-item">
                    <i class="fas fa-home tab-icon"></i>
                    <span class="tab-label">首页</span>
                </a>
                <a href="student/coach-discovery.html" class="tab-item">
                    <i class="fas fa-compass tab-icon"></i>
                    <span class="tab-label">发现</span>
                </a>
                <a href="student/training-plan.html" class="tab-item">
                    <i class="fas fa-calendar-alt tab-icon"></i>
                    <span class="tab-label">计划</span>
                </a>
                <a href="chat.html" class="tab-item">
                    <i class="fas fa-comments tab-icon"></i>
                    <span class="tab-label">聊天</span>
                </a>
                <div class="tab-item active">
                    <i class="fas fa-user tab-icon"></i>
                    <span class="tab-label">我的</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 页面导航
        function navigateTo(page) {
            const pageMap = {
                'subscription': 'student/subscription.html',
                'my-coach': 'student/coach-detail.html',
                'training-data': 'student/profile.html',
                'profile': 'student/profile.html',
                'leaderboard': 'common/leaderboard.html',
                'orders': 'student/orders.html',
                'settings': 'student/settings-detail.html',
                'help': 'student/help-center.html',
                'about': 'student/about.html'
            };

            if (pageMap[page]) {
                window.location.href = pageMap[page];
            }
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                alert('已退出登录');
                // 实际项目中会跳转到登录页
                // window.location.href = '../auth/login.html';
            }
        }

        // 功能项点击效果
        document.querySelectorAll('.feature-item').forEach(item => {
            item.addEventListener('click', function() {
                this.style.backgroundColor = '#f8fafc';
                setTimeout(() => {
                    this.style.backgroundColor = '';
                }, 150);
            });
        });

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.profile-card, .feature-item');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    element.style.transition = 'all 0.3s ease';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
