# Docker Compose 示例：prod / staging / gray 三环境部署
# 复制为 docker-compose.yml 并根据需要修改
#
# 拉取镜像后运行：
# 生产（端口 3000）: docker compose -f docker-compose.example.yml --profile prod up -d
# 预发布（端口 3001）: docker compose -f docker-compose.example.yml --profile staging up -d
# 灰度（端口 3002）: docker compose -f docker-compose.example.yml --profile gray up -d

services:
  coachlink-prod:
    image: peacesheep/coachlink:latest
    profiles: ["prod"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 添加你的环境变量，如 NEXTAUTH_SECRET, NEXT_PUBLIC_SUPABASE_URL 等
    restart: unless-stopped

  coachlink-staging:
    image: peacesheep/coachlink:staging
    profiles: ["staging"]
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      # 预发布环境变量
    restart: unless-stopped

  coachlink-gray:
    image: peacesheep/coachlink:gray
    profiles: ["gray"]
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      # 灰度环境变量
    restart: unless-stopped
