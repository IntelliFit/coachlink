# 体验版（coachlink-dev）专用的检测服务：新引擎先在这里测，正式站仍用 coachlink-boji-service-main。
# 镜像按标签固定，不挂 Keel；上线时用 kubectl set image 换成新 digest。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coachlink-boji-service-dev
  labels:
    app: coachlink-boji-service-dev
    env: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coachlink-boji-service-dev
  template:
    metadata:
      labels:
        app: coachlink-boji-service-dev
        env: dev
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ccr-tencent
      containers:
        - name: coachlink-boji-service-dev
          image: littlehorse/coachlink-boji-service:female-3b41c87
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BOJI_MAX_UPLOAD_MB
              value: "8"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
