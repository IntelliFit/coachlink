apiVersion: apps/v1
kind: Deployment
metadata:
  name: coachlink-boji-service-main
  labels:
    app: coachlink-boji-service-main
    env: main
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  # The single node has no CPU headroom for a second pod during rollout,
  # so the old pod stops first (about 10s without boji detection).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: coachlink-boji-service-main
  template:
    metadata:
      labels:
        app: coachlink-boji-service-main
        env: main
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ccr-tencent
      containers:
        - name: coachlink-boji-service-main
          image: littlehorse/coachlink-boji-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BOJI_MAX_UPLOAD_MB
              value: "8"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
