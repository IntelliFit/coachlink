<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片预览 - 智健联盟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* iPhone 15 Pro 设备框架 */
        .device-frame {
            width: 393px;
            height: 852px;
            background: #1d1d1f;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .device-screen {
            width: 100%;
            height: 100%;
            background: #000000;
            border-radius: 47px;
            overflow: hidden;
            position: relative;
        }

        /* iOS 状态栏 */
        .status-bar {
            height: 54px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            padding-top: 10px;
            position: relative;
            z-index: 50;
        }

        .status-bar-time {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .status-bar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar-icon {
            font-size: 16px;
            color: #ffffff;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000000;
            border-radius: 19px;
            z-index: 100;
        }

        /* 图片容器 */
        .image-container {
            width: 100%;
            height: calc(100% - 54px);
            position: relative;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 图片显示区域 */
        .image-display {
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.3s;
            cursor: grab;
        }

        .main-image:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        /* 导航指示器 */
        .image-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        /* 底部控制栏 */
        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%);
            padding: 40px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
        }

        .nav-button {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
        }

        .action-button {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        /* 缩放控制 */
        .zoom-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .zoom-button {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .zoom-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        /* 响应式 */
        @media (max-width: 430px) {
            .device-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
            }
            .device-screen {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="device-screen">
            <!-- Dynamic Island -->
            <div class="dynamic-island"></div>

            <!-- iOS 状态栏 -->
            <div class="status-bar">
                <div class="status-bar-time">9:41</div>
                <div class="status-bar-icons">
                    <i class="fas fa-signal status-bar-icon"></i>
                    <i class="fas fa-wifi status-bar-icon"></i>
                    <i class="fas fa-battery-full status-bar-icon"></i>
                </div>
            </div>

            <!-- 图片容器 -->
            <div class="image-container">
                <!-- 图片显示区域 -->
                <div class="image-display">
                    <img
                        src="https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=800"
                        alt="训练对比图"
                        class="main-image"
                        id="mainImage"
                        draggable="true"
                    >
                </div>

                <!-- 图片计数器 -->
                <div class="image-counter">
                    3 / 8
                </div>

                <!-- 缩放控制 -->
                <div class="zoom-controls">
                    <button class="zoom-button" onclick="zoomIn()">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="zoom-button" onclick="zoomOut()">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button class="zoom-button" onclick="resetZoom()">
                        <i class="fas fa-expand-arrows-alt"></i>
                    </button>
                </div>

                <!-- 底部控制栏 -->
                <div class="bottom-controls">
                    <div class="nav-buttons">
                        <button class="nav-button" onclick="previousImage()" disabled>
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="nav-button" onclick="nextImage()">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <div class="action-buttons">
                        <button class="action-button" onclick="shareImage()">
                            <i class="fas fa-share"></i>
                        </button>
                        <button class="action-button" onclick="downloadImage()">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="action-button" onclick="deleteImage()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImageIndex = 2; // 当前图片索引（从0开始）
        let totalImages = 8; // 总图片数量
        let scale = 1; // 缩放比例
        let isDragging = false;
        let startX, startY, initialX, initialY;

        const images = [
            'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=800',
            'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=800',
            'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800',
            'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=800',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
            'https://images.unsplash.com/photo-1583500178699-5446532c1dc0?w=800',
            'https://images.unsplash.com/photo-1581009137042-c552e485697a?w=800',
            'https://images.unsplash.com/photo-1583500163326-2a3c6d0c7b5a?w=800'
        ];

        // 更新计数器
        function updateCounter() {
            document.querySelector('.image-counter').textContent = `${currentImageIndex + 1} / ${totalImages}`;
        }

        // 切换到上一张图片
        function previousImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                updateImage();
                updateNavigationButtons();
            }
        }

        // 切换到下一张图片
        function nextImage() {
            if (currentImageIndex < totalImages - 1) {
                currentImageIndex++;
                updateImage();
                updateNavigationButtons();
            }
        }

        // 更新图片
        function updateImage() {
            const mainImage = document.getElementById('mainImage');
            mainImage.src = images[currentImageIndex];
            scale = 1; // 重置缩放
            mainImage.style.transform = `scale(${scale})`;
            updateCounter();
        }

        // 更新导航按钮状态
        function updateNavigationButtons() {
            const prevBtn = document.querySelector('.nav-buttons .nav-button');
            const nextBtn = document.querySelector('.nav-buttons .nav-button:last-child');

            prevBtn.disabled = currentImageIndex === 0;
            nextBtn.disabled = currentImageIndex === totalImages - 1;

            prevBtn.style.opacity = currentImageIndex === 0 ? '0.3' : '1';
            nextBtn.style.opacity = currentImageIndex === totalImages - 1 ? '0.3' : '1';
        }

        // 放大
        function zoomIn() {
            if (scale < 3) {
                scale += 0.5;
                document.getElementById('mainImage').style.transform = `scale(${scale})`;
            }
        }

        // 缩小
        function zoomOut() {
            if (scale > 0.5) {
                scale -= 0.5;
                document.getElementById('mainImage').style.transform = `scale(${scale})`;
            }
        }

        // 重置缩放
        function resetZoom() {
            scale = 1;
            document.getElementById('mainImage').style.transform = `scale(${scale})`;
        }

        // 分享图片
        function shareImage() {
            if (navigator.share) {
                navigator.share({
                    title: '训练对比图',
                    text: '我的训练进步照片',
                    url: images[currentImageIndex]
                });
            } else {
                alert('分享功能演示：复制图片链接');
            }
        }

        // 下载图片
        function downloadImage() {
            // 创建临时链接下载图片
            const link = document.createElement('a');
            link.href = images[currentImageIndex];
            link.download = `training-image-${currentImageIndex + 1}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert('图片下载成功！');
        }

        // 删除图片
        function deleteImage() {
            if (confirm('确定要删除这张图片吗？')) {
                alert('图片删除成功！');
                // 实际项目中会调用删除API
            }
        }

        // 拖拽功能
        function initDrag() {
            const mainImage = document.getElementById('mainImage');

            mainImage.addEventListener('mousedown', function(e) {
                if (scale > 1) {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialX = mainImage.offsetLeft;
                    initialY = mainImage.offsetTop;
                    mainImage.style.cursor = 'grabbing';
                }
            });

            document.addEventListener('mousemove', function(e) {
                if (isDragging && scale > 1) {
                    e.preventDefault();
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    mainImage.style.left = initialX + deltaX + 'px';
                    mainImage.style.top = initialY + deltaY + 'px';
                }
            });

            document.addEventListener('mouseup', function() {
                isDragging = false;
                mainImage.style.cursor = scale > 1 ? 'grab' : 'default';
            });
        }

        // 双击放大/缩小
        document.getElementById('mainImage').addEventListener('dblclick', function() {
            if (scale === 1) {
                zoomIn();
            } else {
                resetZoom();
            }
        });

        // 键盘控制
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    previousImage();
                    break;
                case 'ArrowRight':
                    nextImage();
                    break;
                case '+':
                case '=':
                    zoomIn();
                    break;
                case '-':
                    zoomOut();
                    break;
                case '0':
                    resetZoom();
                    break;
                case 'Escape':
                    // 退出预览
                    alert('退出图片预览');
                    break;
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateCounter();
            updateNavigationButtons();
            initDrag();

            // 点击状态栏退出
            document.querySelector('.status-bar').addEventListener('click', function() {
                alert('退出图片预览');
            });
        });
    </script>
</body>
</html>
