<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>编辑档案 - 智健联盟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; background: #f5f5f7; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .device-frame { width: 393px; height: 852px; background: #1d1d1f; border-radius: 55px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
        .device-screen { width: 100%; height: 100%; background: #f2f2f7; border-radius: 47px; overflow: hidden; position: relative; }
        .status-bar { height: 54px; background: linear-gradient(180deg, rgba(242,242,247,0.95) 0%, rgba(242,242,247,0.9) 100%); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; padding-top: 10px; position: relative; z-index: 50; }
        .status-bar-time { font-size: 15px; font-weight: 600; color: #000000; letter-spacing: -0.3px; }
        .status-bar-icons { display: flex; align-items: center; gap: 6px; }
        .status-bar-icon { font-size: 16px; color: #000000; }
        .dynamic-island { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000000; border-radius: 19px; z-index: 100; }
        .content { height: calc(100% - 54px - 83px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .tab-bar { height: 83px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 0.5px solid rgba(0,0,0,0.1); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s; }
        .tab-item.active .tab-icon { color: #007AFF; }
        .tab-item.active .tab-label { color: #007AFF; }
        .tab-icon { font-size: 24px; color: #8e8e93; }
        .tab-label { font-size: 10px; color: #8e8e93; font-weight: 500; }
        @media (max-width: 430px) { .device-frame { width: 100%; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; } .device-screen { border-radius: 0; } }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="device-screen">
            <div class="dynamic-island"></div>
            <div class="status-bar">
                <div class="status-bar-time">9:41</div>
                <div class="status-bar-icons">
                    <i class="fas fa-signal status-bar-icon"></i>
                    <i class="fas fa-wifi status-bar-icon"></i>
                    <i class="fas fa-battery-full status-bar-icon"></i>
                </div>
            </div>

            <div class="content">
                <div class="p-4">
                    <!-- 头部标题 -->
                    <div class="flex items-center justify-between mb-6">
                        <h1 class="text-xl font-bold text-gray-900">编辑档案</h1>
                        <button class="text-blue-500 font-medium" onclick="saveProfile()">保存</button>
                    </div>

                    <!-- 基本信息 -->
                    <div class="bg-white rounded-2xl p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">基本信息</h2>

                        <!-- 头像 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">头像</label>
                            <div class="flex items-center">
                                <img src="https://i.pravatar.cc/160?img=12" class="w-16 h-16 rounded-full border-4 border-gray-200 mr-4">
                                <div>
                                    <button class="block w-full bg-blue-500 text-white py-2 px-4 rounded-xl text-sm font-medium mb-2" onclick="changeAvatar()">
                                        更换头像
                                    </button>
                                    <button class="block w-full bg-gray-100 text-gray-700 py-2 px-4 rounded-xl text-sm font-medium" onclick="deleteAvatar()">
                                        删除头像
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 昵称 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">昵称</label>
                            <input type="text" value="张三" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 性别 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">性别</label>
                            <div class="flex gap-4">
                                <label class="flex items-center">
                                    <input type="radio" name="gender" value="male" class="mr-2" checked>
                                    <span class="text-gray-900">男</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="gender" value="female" class="mr-2">
                                    <span class="text-gray-900">女</span>
                                </label>
                            </div>
                        </div>

                        <!-- 生日 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">生日</label>
                            <input type="date" value="1990-01-01" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 身高 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">身高 (cm)</label>
                            <input type="number" value="175" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 体重 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">体重 (kg)</label>
                            <input type="number" value="70" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <!-- 训练信息 -->
                    <div class="bg-white rounded-2xl p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">训练信息</h2>

                        <!-- 训练年限 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">训练年限</label>
                            <select class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="beginner" selected>新手 (0-1年)</option>
                                <option value="intermediate">进阶 (1-3年)</option>
                                <option value="advanced">高级 (3-5年)</option>
                                <option value="expert">专家 (5年以上)</option>
                            </select>
                        </div>

                        <!-- 主要目标 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">主要目标</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" name="goal" value="strength" class="mr-2" checked>
                                    <span class="text-gray-900">力量提升</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" name="goal" value="muscle" class="mr-2">
                                    <span class="text-gray-900">增肌</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" name="goal" value="fat-loss" class="mr-2">
                                    <span class="text-gray-900">减脂</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50">
                                    <input type="checkbox" name="goal" value="endurance" class="mr-2">
                                    <span class="text-gray-900">耐力</span>
                                </label>
                            </div>
                        </div>

                        <!-- 卧推1RM -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">卧推1RM (kg)</label>
                            <input type="number" value="85" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 深蹲1RM -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">深蹲1RM (kg)</label>
                            <input type="number" value="100" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 硬拉1RM -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">硬拉1RM (kg)</label>
                            <input type="number" value="120" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <!-- 健康信息 -->
                    <div class="bg-white rounded-2xl p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">健康信息</h2>

                        <!-- 伤病史 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">伤病史</label>
                            <textarea rows="3" placeholder="请描述您的伤病情况（如果有的话）" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
                        </div>

                        <!-- 过敏史 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">过敏史</label>
                            <textarea rows="2" placeholder="请描述您的过敏情况（如果有的话）" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
                        </div>

                        <!-- 特殊需求 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">特殊需求</label>
                            <textarea rows="2" placeholder="其他需要教练了解的信息" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
                        </div>
                    </div>

                    <!-- 隐私设置 -->
                    <div class="bg-white rounded-2xl p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">隐私设置</h2>

                        <div class="space-y-4">
                            <label class="flex items-center justify-between p-3 border border-gray-200 rounded-xl">
                                <div>
                                    <div class="font-medium text-gray-900">公开训练数据</div>
                                    <div class="text-sm text-gray-500">允许其他用户查看您的训练记录</div>
                                </div>
                                <input type="checkbox" class="toggle-switch" checked>
                            </label>

                            <label class="flex items-center justify-between p-3 border border-gray-200 rounded-xl">
                                <div>
                                    <div class="font-medium text-gray-900">公开成就徽章</div>
                                    <div class="text-sm text-gray-500">允许其他用户查看您的成就</div>
                                </div>
                                <input type="checkbox" class="toggle-switch" checked>
                            </label>

                            <label class="flex items-center justify-between p-3 border border-gray-200 rounded-xl">
                                <div>
                                    <div class="font-medium text-gray-900">允许教练查看详细数据</div>
                                    <div class="text-sm text-gray-500">您的教练可以查看完整训练历史</div>
                                </div>
                                <input type="checkbox" class="toggle-switch" checked>
                            </label>
                        </div>
                    </div>

                    <div class="text-center py-6 mt-6">
                        <a href="../index.html" class="text-gray-400 text-sm">
                            <i class="fas fa-arrow-left mr-2"></i>返回导航
                        </a>
                    </div>
                </div>
            </div>

            <div class="tab-bar">
                <a href="home.html" class="tab-item">
                    <i class="fas fa-home tab-icon"></i>
                    <span class="tab-label">首页</span>
                </a>
                <a href="coach-discovery.html" class="tab-item">
                    <i class="fas fa-compass tab-icon"></i>
                    <span class="tab-label">发现</span>
                </a>
                <a href="training-plan.html" class="tab-item">
                    <i class="fas fa-calendar-alt tab-icon"></i>
                    <span class="tab-label">计划</span>
                </a>
                <a href="../common/chat.html" class="tab-item">
                    <i class="fas fa-comments tab-icon"></i>
                    <span class="tab-label">聊天</span>
                </a>
                <div class="tab-item active">
                    <i class="fas fa-user tab-icon"></i>
                    <span class="tab-label">我的</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 保存档案
        function saveProfile() {
            alert('档案信息已保存');
        }

        // 更换头像
        function changeAvatar() {
            alert('打开相册选择头像');
        }

        // 删除头像
        function deleteAvatar() {
            if (confirm('确定要删除头像吗？')) {
                alert('头像已删除');
            }
        }

        // 开关切换
        document.querySelectorAll('.toggle-switch').forEach(toggle => {
            toggle.addEventListener('change', function() {
                this.style.backgroundColor = this.checked ? '#3b82f6' : '#e5e7eb';
            });
        });

        // 输入框聚焦效果
        document.querySelectorAll('input, select, textarea').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 200);
            });
        });

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.bg-white');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    element.style.transition = 'all 0.3s ease';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 150);
            });
        });
    </script>
</body>
</html>
