<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachLink - 学员管理</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-header" id="header"></header>
            <div class="page-content">
                
                <div class="flex justify-between items-center mb-lg">
                    <h2 class="text-xl font-semibold">我的学员</h2>
                    <button class="btn btn-primary">邀请学员</button>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr class="text-left text-secondary text-sm border-b border-gray-200">
                                    <th class="p-md">学员姓名</th>
                                    <th class="p-md">当前计划</th>
                                    <th class="p-md">状态</th>
                                    <th class="p-md">最近活跃</th>
                                    <th class="p-md">操作</th>
                                </tr>
                            </thead>
                            <tbody id="client-list">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/mock_data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            renderClients();
        });

        function renderClients() {
            const list = document.getElementById('client-list');
            const clients = Store.get('clients');
            const clientPlans = Store.get('clientPlans') || {};

            list.innerHTML = clients.map(client => {
                const hasPlan = clientPlans[client.id] && clientPlans[client.id].length > 0;
                const planStatusBadge = hasPlan 
                    ? '<span class="badge badge-success">进行中</span>' 
                    : '<span class="badge badge-secondary">未制定</span>';
                const planName = hasPlan ? client.plan : '暂无计划';
                
                const actionButton = hasPlan
                    ? `<button class="btn btn-secondary btn-sm" onclick="window.location.href='plan-editor.html?clientId=${client.id}'">查看/调整</button>`
                    : `<button class="btn btn-primary btn-sm" onclick="window.location.href='plan-editor.html?clientId=${client.id}'">制定计划</button>`;

                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="p-md font-medium">${client.name}</td>
                    <td class="p-md text-secondary">${planName}</td>
                    <td class="p-md">${planStatusBadge}</td>
                    <td class="p-md text-secondary text-sm">${client.lastActive}</td>
                    <td class="p-md">
                        <div class="flex gap-xs">
                            ${actionButton}
                            <button class="btn btn-secondary btn-sm">查看详情</button>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
