name: Build and Push Docker Image

on:
  push:
    branches: [main, dev, gray]

jobs:
  # 推送到 Docker Hub
  push-to-dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE="peacesheep/coachlink"
          
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$IMAGE:latest" >> $GITHUB_OUTPUT
            echo "$IMAGE:production" >> $GITHUB_OUTPUT
            echo "$IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$IMAGE:staging" >> $GITHUB_OUTPUT
            echo "$IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/gray" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$IMAGE:gray" >> $GITHUB_OUTPUT
            echo "$IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=gray" >> $GITHUB_OUTPUT
          fi

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output summary
        run: |
          echo "### Docker Hub 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "Docker Hub 镜像: ${{ steps.meta.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "标签: ${{ steps.meta.outputs.deploy_env }} (${{ steps.meta.outputs.short_sha }})" >> $GITHUB_STEP_SUMMARY

  # 推送到阿里云 ACR
  push-to-aliyun:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Determine image tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ACR_IMAGE="registry.cn-hangzhou.aliyuncs.com/coachlink/coachlink"
          
          echo "acr_image=$ACR_IMAGE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:latest" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:production" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:staging" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/gray" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:gray" >> $GITHUB_OUTPUT
            echo "$ACR_IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "deploy_env=gray" >> $GITHUB_OUTPUT
          fi

      - name: Build and push to Aliyun ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output summary
        run: |
          echo "### 阿里云 ACR 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "阿里云 ACR 镜像: ${{ steps.meta.outputs.acr_image }}" >> $GITHUB_STEP_SUMMARY
          echo "标签: ${{ steps.meta.outputs.deploy_env }} (${{ steps.meta.outputs.short_sha }})" >> $GITHUB_STEP_SUMMARY
