# 构建并推送到自建 Docker Registry（与本地 .env 对应项一致，勿把密码写入仓库）
#
# 镜像全名：{registry 主机[:端口]}/{镜像路径}:{标签}
# registry 须与证书 CN/SAN 一致，且与 docker login 使用的地址一致。
#
# Nginx 对外 443、反代到本机 5000 时：只配 REGISTRY_HOST（不要配 REGISTRY_PORT），
# 即 docker login / 镜像引用均为 host 默认 443，无 :5000。
#
# --- GitHub Secrets（必须）---
# REGISTRY_USERNAME   例如 registry
# REGISTRY_PASSWORD   强密码；仅放在 Secrets，勿提交 .env
#
# --- GitHub Variables（仓库 Settings → Secrets and variables → Actions → Variables）---
# REGISTRY_HOST           必填。对外访问用主机名，如 docker-registry.littlehorse.website（不要带 https://）
# REGISTRY_PORT           可选。仅当你直连 registry 监听端口时才填（如内网 host:5000）；Nginx 终止 TLS 时不要设
# REGISTRY_IMAGE_PATH     可选。如 coachlink/coachlink；默认 coachlink/coachlink
#
# 本地验证（经 Nginx 443，无端口）：
#   docker login docker-registry.littlehorse.website -u registry
#   docker pull docker-registry.littlehorse.website/coachlink/coachlink:dev
name: Build and Push Docker Image

on:
  push:
    branches: [main, dev, gray]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry and image base
        id: reg
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_PORT: ${{ vars.REGISTRY_PORT }}
          REGISTRY_IMAGE_PATH: ${{ vars.REGISTRY_IMAGE_PATH }}
        run: |
          set -euo pipefail
          HOST="${REGISTRY_HOST:-}"
          PORT="${REGISTRY_PORT:-}"
          IMG_PATH="${REGISTRY_IMAGE_PATH:-coachlink/coachlink}"

          if [ -z "${HOST}" ]; then
            echo "::error::请在仓库 Actions Variables 中设置 REGISTRY_HOST（须与证书 CN/SAN、docker login 一致）。"
            exit 1
          fi

          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%/}"

          # 与 docker login 一致：Nginx 443 反代时 PORT 留空 → 仅 HOST；直连非 443 端口时才 HOST:PORT
          if [ -n "${PORT}" ] && [ "${PORT}" != "443" ]; then
            REGISTRY="${HOST}:${PORT}"
          else
            REGISTRY="${HOST}"
          fi

          IMG_PATH="${IMG_PATH#/}"
          IMAGE_BASE="${REGISTRY}/${IMG_PATH}"

          echo "registry=${REGISTRY}" >> "${GITHUB_OUTPUT}"
          echo "image_base=${IMAGE_BASE}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Determine image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ steps.reg.outputs.image_base }}"

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:production"
              echo "${IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "deploy_env=production" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:dev"
              echo "${IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "deploy_env=dev" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref }}" = "refs/heads/gray" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:gray"
              echo "${IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            echo "deploy_env=gray" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image (local)
        if: ${{ steps.meta.outputs.tags != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image tags to registry
        if: ${{ steps.meta.outputs.tags != '' }}
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            docker push "${tag}"
          done <<< "${DOCKER_TAGS}"

      - name: Output summary
        run: |
          echo "### 自建 Registry：构建与推送完成" >> "${GITHUB_STEP_SUMMARY}"
          echo "Registry: ${{ steps.reg.outputs.registry }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "镜像: ${{ steps.meta.outputs.image }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "环境: ${{ steps.meta.outputs.deploy_env }} (${{ steps.meta.outputs.short_sha }})" >> "${GITHUB_STEP_SUMMARY}"
