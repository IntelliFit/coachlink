<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachLink - 个人档案</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .profile-section {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .profile-header {
            text-align: center;
            padding: var(--spacing-xl) 0;
        }
        
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto var(--spacing-md);
            box-shadow: var(--shadow-lg);
        }
        
        .profile-meta {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .profile-meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .subscription-tag {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: 0.375rem 0.75rem;
            background: linear-gradient(135deg, #e0e7ff 0%, #ddd6fe 100%);
            color: var(--primary-color);
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .coach-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            transition: all var(--transition-fast);
        }
        
        .coach-list-item:hover {
            background: var(--background-color);
            border-color: var(--primary-color);
        }
        
        .coach-info-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .coach-avatar-medium {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            border: 2px solid var(--border-color);
        }
        
        .subscription-badge {
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }
        
        .subscription-badge.premium {
            background: linear-gradient(135deg, #e0e7ff 0%, #ddd6fe 100%);
            color: var(--primary-color);
        }
        
        /* Progress Chart */
        .chart-container {
            position: relative;
            height: 300px;
            margin: var(--spacing-md) 0;
        }
        
        .chart-switcher {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .chart-tab {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 0.875rem;
        }
        
        .chart-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* Progress Timeline */
        .timeline {
            position: relative;
            padding-left: var(--spacing-xl);
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #6366f1 0%, #e0e7ff 100%);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: var(--spacing-xl);
            background: white;
            border: 2px solid #e0e7ff;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            transition: all var(--transition-fast);
        }
        
        .timeline-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }
        
        .timeline-item::before {
            content: '🏆';
            position: absolute;
            left: -42px;
            top: var(--spacing-md);
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 3px solid white;
            box-shadow: var(--shadow-sm);
        }
        
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-sm);
        }
        
        .timeline-date {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .timeline-exercise {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .timeline-stats {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .timeline-stat {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .timeline-video {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: var(--spacing-sm);
            cursor: pointer;
        }
        
        .timeline-video img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .timeline-video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .timeline-video:hover .timeline-video-overlay {
            opacity: 1;
        }
        
        .timeline-video-play {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.9);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }
        
        .timeline-note {
            background: var(--background-color);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            font-size: 0.875rem;
        }
        
        .timeline-coach-comment {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }
        
        .timeline-coach-comment-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-weight: 600;
            color: #92400e;
            margin-bottom: var(--spacing-xs);
        }
        
        /* Training History */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            background: var(--background-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .history-item:hover {
            background: #e0e7ff;
        }
        
        .history-date {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .history-summary {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        /* Coach Notes */
        .coach-notes-content {
            background: var(--background-color);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--primary-color);
            font-size: 0.9375rem;
            line-height: 1.6;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
        }
        
        .info-item {
            padding: var(--spacing-md);
            background: var(--background-color);
            border-radius: var(--radius-md);
        }
        
        .info-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        
        .info-value {
            font-size: 1.125rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-header" id="header"></header>
            <div class="page-content">
                
                <!-- Profile Header - 动态生成 -->
                <div class="profile-section">
                    <div class="profile-header">
                        <div class="profile-avatar-large" id="profile-avatar">李</div>
                        <h1 class="text-2xl font-bold mb-xs" id="profile-name">李明</h1>
                        <p class="text-secondary mb-sm">学员</p>
                        
                        <!-- Profile Meta Info -->
                        <div class="profile-meta">
                            <div class="profile-meta-item">
                                <i data-lucide="Users"></i>
                                <span id="profile-coach-count">已订阅 0 位教练</span>
                            </div>
                            <div class="subscription-tag">
                                <i data-lucide="Crown"></i>
                                <span id="profile-tier">学员</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Coach Application CTA -->
                <div class="profile-section">
                    <div class="flex justify-between items-center gap-md">
                        <div>
                            <h2 class="section-title" style="margin-bottom: 0;">
                                <i data-lucide="ClipboardCheck"></i>
                                教练申请进度
                            </h2>
                            <p class="text-secondary mt-xs">
                                当前状态：
                                <span id="coach-application-pill" class="badge badge-secondary">未申请</span>
                            </p>
                        </div>
                        <button class="btn btn-primary" id="coach-application-action"></button>
                    </div>
                    <p class="text-secondary text-sm mt-sm" id="coach-application-hint">
                        完成认证后即可在同一账号内自由切换学员/教练身份。
                    </p>
                </div>

                <!-- Personal Info - 动态生成 -->
                <div class="profile-section">
                    <h2 class="section-title">
                        <i data-lucide="User"></i>
                        个人信息
                    </h2>
                    <div id="personal-info-container">
                        <!-- 动态生成个人信息 -->
                    </div>
                    <div class="text-center mt-md">
                        <button class="btn btn-secondary" onclick="openEditProfileModal()">
                            <i data-lucide="Edit" class="mr-2"></i>
                            编辑资料
                        </button>
                    </div>
                </div>

                <!-- My Progress Section - 动态生成 -->
                <div class="profile-section" id="progress-section">
                    <h2 class="section-title">
                        <i data-lucide="TrendingUp"></i>
                        我的进步
                    </h2>
                    <div id="progress-chart-container">
                        <!-- 动态生成进步图表 -->
                    </div>
                </div>

                <!-- Progress Timeline - 动态生成 -->
                <div class="profile-section" id="timeline-section">
                    <h2 class="section-title">
                        <i data-lucide="Award"></i>
                        进步时间线
                    </h2>
                    <p class="text-secondary mb-md">记录每一个值得骄傲的突破时刻</p>
                    <div class="timeline" id="timeline-container">
                        <!-- 动态生成时间线 -->
                    </div>
                </div>

                <!-- My Coaches Section - 动态生成 -->
                <div class="profile-section">
                    <h2 class="section-title">
                        <i data-lucide="Users"></i>
                        我的教练
                    </h2>
                    
                    <div id="my-coaches-list">
                        <!-- 动态生成教练列表 -->
                    </div>

                    <div class="text-center mt-md">
                        <a href="discover-coaches.html" class="btn btn-primary">
                            <i data-lucide="Search" class="mr-2"></i>
                            发现更多教练
                        </a>
                    </div>
                </div>

                <!-- Coach's Observations - 动态生成 -->
                <div class="profile-section" id="coach-notes-section">
                    <h2 class="section-title">
                        <i data-lucide="Eye"></i>
                        教练观察与建议
                    </h2>
                    <p class="text-secondary text-sm mb-md">教练对你的专业观察和长期建议</p>
                    <div id="coach-notes-container">
                        <!-- 动态生成教练观察与建议 -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/mock_data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Initialize Chart
        let progressChart;
        const chartData = {
            weight: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [78, 77.5, 77, 76.5, 76, 75.5, 75.2, 75],
                label: '体重 (kg)',
                color: 'rgb(99, 102, 241)'
            },
            bench: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [85, 87, 89, 91, 93, 95, 98, 100],
                label: '卧推1RM (kg)',
                color: 'rgb(236, 72, 153)'
            },
            squat: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [100, 102, 105, 108, 110, 113, 117, 120],
                label: '深蹲1RM (kg)',
                color: 'rgb(16, 185, 129)'
            }
        };

        function updateCoachApplicationCard() {
            const pill = document.getElementById('coach-application-pill');
            const hintEl = document.getElementById('coach-application-hint');
            const actionBtn = document.getElementById('coach-application-action');
            if (!pill || !hintEl || !actionBtn) return;

            const user = MockData.currentUser;
            const roles = user.roles || [];
            const application = CoachApplicationService.getByUserId(user.id);

            let badgeText = '未申请';
            let badgeClass = 'badge badge-secondary';
            let hint = '完成认证后即可在同一账号内自由切换学员/教练身份。';
            let actionLabel = '申请成为教练';
            let actionType = 'apply';
            let icon = 'ClipboardCheck';

            if (roles.includes('coach')) {
                badgeText = '已获得教练权限';
                badgeClass = 'badge badge-success';
                hint = '恭喜！您已获得教练权限，点击按钮即可进入教练端。';
                actionLabel = '进入教练端';
                actionType = 'switch';
                icon = 'Repeat';
            } else if (application) {
                if (application.status === 'draft') {
                    badgeText = '草稿未提交';
                    badgeClass = 'badge badge-warning';
                    hint = '您已保存申请草稿，点击继续完善并提交审核。';
                    actionLabel = '继续编辑申请';
                    icon = 'Edit3';
                } else if (application.status === 'pending') {
                    badgeText = '审核中';
                    badgeClass = 'badge badge-warning';
                    hint = '教练团队正在审核您的资料，通常会在2个工作日内给出结果。';
                    actionLabel = '查看申请详情';
                    actionType = 'apply';
                    icon = 'Eye';
                } else if (application.status === 'rejected') {
                    badgeText = '已驳回';
                    badgeClass = 'badge badge-danger';
                    hint = application.rejectionReason
                        ? `驳回原因：${application.rejectionReason}。请修改后重新提交。`
                        : '申请未通过，请根据提示修改后再次提交。';
                    actionLabel = '重新提交申请';
                    icon = 'RotateCcw';
                } else if (application.status === 'approved') {
                    badgeText = '已通过';
                    badgeClass = 'badge badge-success';
                    hint = '系统正在为您开通教练端功能，请点击进入完成初始化。';
                    actionLabel = '进入教练端';
                    actionType = 'switch';
                    icon = 'Repeat';
                }
            }

            pill.textContent = badgeText;
            pill.className = badgeClass;
            hintEl.textContent = hint;
            actionBtn.innerHTML = `<i data-lucide="${icon}" class="mr-2"></i>${actionLabel}`;
            actionBtn.disabled = false;
            actionBtn.onclick = () => {
                if (actionType === 'switch') {
                    RoleManager.switchRole('coach');
                } else {
                    window.location.href = 'coach-application.html';
                }
            };
            lucide.createIcons();
        }

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const data = chartData.weight;
            
            progressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: data.label,
                        data: data.data,
                        borderColor: data.color,
                        backgroundColor: data.color + '20',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: data.color,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' kg';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return value + ' kg';
                                }
                            }
                        }
                    }
                }
            });
        }

        function switchChart(type) {
            // Update tab states
            document.querySelectorAll('.chart-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update chart data
            const data = chartData[type];
            progressChart.data.labels = data.labels;
            progressChart.data.datasets[0].label = data.label;
            progressChart.data.datasets[0].data = data.data;
            progressChart.data.datasets[0].borderColor = data.color;
            progressChart.data.datasets[0].backgroundColor = data.color + '20';
            progressChart.data.datasets[0].pointBackgroundColor = data.color;
            progressChart.update();
        }

        function playVideo(videoId) {
            alert(`播放视频: ${videoId}\n(实际应用中会打开全屏视频播放器)`);
        }

        function viewTraining(date) {
            alert(`跳转到 ${date} 的训练记录详情`);
        }

        // 获取当前用户订阅的教练列表（排除自己）
        function getSubscribedCoaches() {
            const currentUser = UserService.getCurrentUser();
            const subscriptions = Store.get('subscriptions') || {};
            const userSubs = subscriptions[currentUser.id] || {};
            const coaches = Store.get('coaches') || [];
            const coachProfiles = Store.get('coachProfiles') || {};
            
            // 获取订阅的教练ID列表（排除自己）
            const subscribedCoachIds = Object.keys(userSubs).filter(coachId => {
                if (currentUser.coachProfileId === coachId) return false;
                return userSubs[coachId] && userSubs[coachId] !== 'none';
            });
            
            // 返回教练详情
            return subscribedCoachIds.map(coachId => {
                const coach = coaches.find(c => c.id === coachId);
                const profile = coachProfiles[coachId] || {};
                const tier = userSubs[coachId];
                return coach ? {
                    id: coach.id,
                    name: coach.name,
                    avatarUrl: coach.avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${coachId}`,
                    specialties: (coach.specialties || []).join(' · '),
                    tier: tier,
                    tierLabel: tier === 'premium' ? '高级版' : 'AI版',
                    months: tier === 'premium' ? 4 : 1,
                    weeks: tier === 'premium' ? 16 : 4
                } : null;
            }).filter(Boolean);
        }
        
        // 更新个人资料头部
        function updateProfileHeader() {
            const currentUser = UserService.getCurrentUser();
            const subscribedCoaches = getSubscribedCoaches();
            
            document.getElementById('profile-avatar').textContent = currentUser.avatar || currentUser.name.charAt(0);
            document.getElementById('profile-name').textContent = currentUser.name;
            document.getElementById('profile-coach-count').textContent = `已订阅 ${subscribedCoaches.length} 位教练`;
            
            // 确定最高订阅等级
            const hasPremium = subscribedCoaches.some(c => c.tier === 'premium');
            document.getElementById('profile-tier').textContent = hasPremium ? '高级版' : (subscribedCoaches.length > 0 ? 'AI版' : '学员');
        }
        
        // 渲染教练列表
        function renderMyCoaches() {
            const container = document.getElementById('my-coaches-list');
            const subscribedCoaches = getSubscribedCoaches();
            
            if (subscribedCoaches.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-lg text-secondary">
                        <i data-lucide="Users" size="48" style="opacity: 0.4; margin-bottom: 1rem;"></i>
                        <p>您还没有订阅任何教练</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            container.innerHTML = subscribedCoaches.map(coach => `
                <div class="coach-list-item">
                    <div class="coach-info-row">
                        <img src="${coach.avatarUrl}" alt="${coach.name}" class="coach-avatar-medium">
                        <div>
                            <div class="font-semibold">${coach.name}</div>
                            <div class="text-xs text-secondary">${coach.specialties || '专业教练'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-sm">
                        <div class="text-right mr-2">
                            <div class="text-sm font-semibold text-primary">${coach.months}个月</div>
                            <div class="text-xs text-secondary">${coach.weeks}周计划</div>
                        </div>
                        <span class="subscription-badge ${coach.tier === 'premium' ? 'premium' : ''}">${coach.tierLabel}</span>
                        <a href="coach-profile.html?id=${coach.id}" class="btn btn-secondary btn-sm" onclick="return openCoachProfile('${coach.id}');">
                            查看主页
                        </a>
                    </div>
                </div>
            `).join('');
        }

                            </div>
                            
                            <!-- 一般体能卡片数据 -->
                            <div id="section-generalFitness" class="mb-md p-md rounded" style="background: #eff6ff; display: ${activeCards.includes('generalFitness') ? 'block' : 'none'};">
                                <h5 class="font-semibold mb-sm" style="color: #1e40af;">🏃 一般体能数据</h5>
                                <div class="grid gap-md" style="grid-template-columns: repeat(2, 1fr);">
                                    <div>
                                        <label class="block text-sm mb-xs">引体向上 (个)</label>
                                        <input type="number" id="gf-pullups" class="input-field w-full" value="${cardData.generalFitness?.pullups || ''}">
                                    </div>
                                    <div>
                                        <label class="block text-sm mb-xs">静态心率 (bpm)</label>
                                        <input type="number" id="gf-hr" class="input-field w-full" value="${cardData.generalFitness?.restingHR || ''}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex justify-end gap-md p-md" style="border-top: 1px solid var(--border-color); background: #f8fafc;">
                            <button class="btn btn-secondary" onclick="closeEditProfileModal()">取消</button>
                            <button class="btn btn-primary" onclick="saveProfile()">
                                <i data-lucide="Save" size="16" class="mr-1"></i>
                                保存
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        }
        
        function closeEditProfileModal() {
            const modal = document.getElementById('edit-profile-modal');
            if (modal) modal.remove();
        }
        
        function toggleCardSection(cardType, checked) {
            const section = document.getElementById(`section-${cardType}`);
            if (section) {
                section.style.display = checked ? 'block' : 'none';
            }
        }
        
        function saveProfile() {
            const currentUser = UserService.getCurrentUser();
            
            // 收集基本信息
            const age = parseInt(document.getElementById('edit-age').value) || null;
            const gender = document.getElementById('edit-gender').value;
            const height = parseInt(document.getElementById('edit-height').value) || null;
            const weight = parseInt(document.getElementById('edit-weight').value) || null;
            const lifestyle = document.getElementById('edit-lifestyle').value.trim();
            
            // 收集伤病史
            const injuriesText = document.getElementById('edit-injuries').value.trim();
            const injuries = injuriesText ? injuriesText.split(/[、,，]/).map(s => s.trim()).filter(Boolean) : [];
            
            // 收集激活的卡片
            const activeCards = [];
            const cardData = {};
            
            if (document.getElementById('card-powerlifting').checked) {
                activeCards.push('powerlifting');
                cardData.powerlifting = {
                    squat: parseInt(document.getElementById('pl-squat').value) || 0,
                    bench: parseInt(document.getElementById('pl-bench').value) || 0,
                    deadlift: parseInt(document.getElementById('pl-deadlift').value) || 0
                };
            }
            
            if (document.getElementById('card-bodybuilding').checked) {
                activeCards.push('bodybuilding');
                cardData.bodybuilding = {
                    chest: parseInt(document.getElementById('bb-chest').value) || null,
                    arm: parseInt(document.getElementById('bb-arm').value) || null,
                    waist: parseInt(document.getElementById('bb-waist').value) || null,
                    bodyFat: parseInt(document.getElementById('bb-bodyfat').value) || null
                };
            }
            
            if (document.getElementById('card-generalFitness').checked) {
                activeCards.push('generalFitness');
                cardData.generalFitness = {
                    pullups: parseInt(document.getElementById('gf-pullups').value) || null,
                    restingHR: parseInt(document.getElementById('gf-hr').value) || null
                };
            }
            
            // 构建 profile 对象
            const newProfile = {
                height,
                weight,
                age,
                gender,
                injuries,
                lifestyle,
                activeCards,
                cardData
            };
            
            // 更新用户数据
            const users = Store.get('users') || [];
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                users[userIndex].profile = newProfile;
                Store.set('users', users);
            }
            
            closeEditProfileModal();
            
            // 重新渲染页面
            renderPersonalInfo();
            updateProfileHeader();
            lucide.createIcons();
            
            alert('✅ 档案已保存！');
        }

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            const subscribedCoaches = getSubscribedCoaches();
            
            updateProfileHeader();
            renderPersonalInfo();
            renderProgressChart();
            renderTimeline();
            renderMyCoaches();
            renderCoachNotes();
            lucide.createIcons();
            
            // 只有有订阅教练时才初始化图表
            if (subscribedCoaches.length > 0) {
                setTimeout(() => {
                    const canvas = document.getElementById('progressChart');
                    if (canvas) {
                        initChart();
                    }
                }, 100);
            }
            
            updateCoachApplicationCard();
        });
    </script>
</body>
</html>
