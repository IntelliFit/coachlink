<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachLink - 学员管理</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Drawer Styles */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -600px; /* Width of drawer */
            width: 600px;
            height: 100vh;
            background: white;
            z-index: 1001;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            z-index: 10;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-lg);
        }

        /* Profile Styles (Copied from client-profile.html) */
        .profile-section {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .section-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .profile-header {
            text-align: center;
            padding: var(--spacing-md) 0;
        }
        
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 auto var(--spacing-md);
            box-shadow: var(--shadow-lg);
        }
        
        .profile-meta {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .profile-meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .subscription-tag {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, #e0e7ff 0%, #ddd6fe 100%);
            color: var(--primary-color);
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.75rem;
        }
        
        /* Progress Chart */
        .chart-container {
            position: relative;
            height: 250px;
            margin: var(--spacing-md) 0;
        }
        
        .chart-switcher {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .chart-tab {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 0.75rem;
        }
        
        .chart-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* Progress Timeline */
        .timeline {
            position: relative;
            padding-left: var(--spacing-xl);
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #6366f1 0%, #e0e7ff 100%);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: var(--spacing-lg);
            background: white;
            border: 1px solid #e0e7ff;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            transition: all var(--transition-fast);
        }
        
        .timeline-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }
        
        .timeline-item::before {
            content: '🏆';
            position: absolute;
            left: -42px;
            top: var(--spacing-md);
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 3px solid white;
            box-shadow: var(--shadow-sm);
        }
        
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-sm);
        }
        
        .timeline-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .timeline-exercise {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .timeline-stats {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }
        
        .timeline-stat {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .timeline-video {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: var(--spacing-sm);
            cursor: pointer;
        }
        
        .timeline-video img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        
        .timeline-video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .timeline-video:hover .timeline-video-overlay {
            opacity: 1;
        }
        
        .timeline-video-play {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.9);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }
        
        .timeline-note {
            background: var(--background-color);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            font-size: 0.875rem;
        }
        
        .timeline-coach-comment {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }
        
        .timeline-coach-comment-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-weight: 600;
            color: #92400e;
            margin-bottom: var(--spacing-xs);
        }
        
        /* Coach Notes */
        .coach-notes-content {
            background: var(--background-color);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--primary-color);
            font-size: 0.9375rem;
            line-height: 1.6;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
        }
        
        .info-item {
            padding: var(--spacing-md);
            background: var(--background-color);
            border-radius: var(--radius-md);
        }
        
        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        
        .info-value {
            font-size: 1rem;
            font-weight: 600;
        }
        
        /* 新需求徽章脉冲动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-header" id="header"></header>
            <div class="page-content">
                
                <div class="flex justify-between items-center mb-lg">
                    <h2 class="text-xl font-semibold">我的学员</h2>
                    <button class="btn btn-primary">邀请学员</button>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr class="text-left text-secondary text-sm border-b border-gray-200">
                                    <th class="p-md">学员姓名</th>
                                    <th class="p-md">当前计划</th>
                                    <th class="p-md">状态</th>
                                    <th class="p-md">最近活跃</th>
                                    <th class="p-md">操作</th>
                                </tr>
                            </thead>
                            <tbody id="client-list">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Drawer Overlay -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeProfile()"></div>

    <!-- Profile Drawer -->
    <div class="drawer" id="profile-drawer">
        <div class="drawer-header">
            <h3 class="text-lg font-bold">学员档案</h3>
            <button class="btn btn-icon" onclick="closeProfile()">
                <i data-lucide="X"></i>
            </button>
        </div>
        <div class="drawer-content">
            <!-- Profile Header -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar-large" id="drawer-avatar">李</div>
                    <h1 class="text-2xl font-bold mb-xs" id="drawer-name">李明</h1>
                    <p class="text-secondary mb-sm">学员</p>
                    
                    <div class="profile-meta">
                        <div class="profile-meta-item">
                            <i data-lucide="Users"></i>
                            <span>已订阅 2 位教练</span>
                        </div>
                        <div class="profile-meta-item">
                            <i data-lucide="Clock"></i>
                            <span id="profile-subscription">订阅时长: 4个月 (16周)</span>
                        </div>
                        <div class="subscription-tag" id="drawer-tier-badge">
                            <i data-lucide="Crown"></i>
                            高级版
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 本期需求 - 新增 -->
            <div class="profile-section" id="service-request-section" style="display: none; background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 100%); border: 2px solid #3b82f6;">
                <h2 class="section-title" style="color: #1e40af;">
                    <i data-lucide="ClipboardList"></i>
                    📋 本期需求
                </h2>
                <p class="text-xs text-secondary mb-md">学员订阅时填写的需求问卷</p>
                <div id="service-request-content">
                    <!-- 动态渲染问答 -->
                </div>
            </div>

            <!-- Personal Info - 动态渲染 -->
            <div class="profile-section">
                <h2 class="section-title">
                    <i data-lucide="User"></i>
                    公共档案
                </h2>
                <div id="profile-info-container">
                    <!-- 由 renderProfileSection() 动态生成 -->
                </div>
            </div>

            <!-- My Progress Section -->
            <div class="profile-section">
                <h2 class="section-title">
                    <i data-lucide="TrendingUp"></i>
                    进步趋势
                </h2>
                
                <!-- Chart Switcher -->
                <div class="chart-switcher">
                    <button class="chart-tab active" onclick="switchChart('weight')">体重变化</button>
                    <button class="chart-tab" onclick="switchChart('bench')">卧推1RM</button>
                    <button class="chart-tab" onclick="switchChart('squat')">深蹲1RM</button>
                </div>
                
                <!-- Chart Container -->
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>

            <!-- Progress Timeline - 动态渲染 -->
            <div class="profile-section">
                <h2 class="section-title">
                    <i data-lucide="Award"></i>
                    进步时间线
                </h2>
                <div id="profile-timeline-container">
                    <!-- 由 renderProfileTimeline() 动态生成 -->
                </div>
            </div>

            <!-- Coach's Observations - 动态渲染 -->
            <div class="profile-section">
                <div class="flex justify-between items-center mb-md">
                    <h2 class="section-title mb-0">
                        <i data-lucide="Eye"></i>
                        我的观察与建议
                    </h2>
                    <button class="btn btn-secondary btn-sm">
                        <i data-lucide="Edit" class="w-4 h-4 mr-1"></i>
                        编辑
                    </button>
                </div>
                <p class="text-secondary text-sm mb-md">记录对学员的专业观察和长期建议</p>
                <div id="profile-coach-notes-container">
                    <!-- 由 renderCoachNotes() 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="../js/mock_data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            renderClients();
        });

        function renderClients() {
            const list = document.getElementById('client-list');
            const allClients = Store.get('clients') || {};
            
            // 获取当前教练的 coachProfileId
            const currentUser = UserService.getCurrentUser();
            const coachProfileId = currentUser.coachProfileId || currentUser.id;
            
            // 获取当前教练的学员列表
            const clients = allClients[coachProfileId] || [];
            
            if (clients.length === 0) {
                list.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-lg text-center text-secondary">
                            <div style="padding: 2rem;">
                                <i data-lucide="Users" size="48" style="opacity: 0.4; margin-bottom: 1rem;"></i>
                                <p>暂无学员</p>
                                <p class="text-sm mt-sm">当有学员订阅您的服务后，将在这里显示</p>
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }
            
            // 获取订阅问卷数据，检查是否有新需求
            const allAnswers = Store.get('subscriptionAnswers') || {};
            
            list.innerHTML = clients.map(client => {
                const hasPlan = client.hasPlan;
                const planStatusBadge = hasPlan 
                    ? '<span class="badge badge-success">进行中</span>' 
                    : '<span class="badge badge-secondary">未制定</span>';
                const planName = hasPlan ? client.plan : '暂无计划';
                
                const actionButton = hasPlan
                    ? `<button class="btn btn-secondary btn-sm" onclick="openPlanEditor('${client.id}')">查看/调整</button>`
                    : `<button class="btn btn-primary btn-sm" onclick="openPlanEditor('${client.id}')">制定计划</button>`;
                
                const chatButton = `<button class="btn btn-icon btn-sm ml-sm" title="聊天" onclick="window.location.href='chat.html?studentId=${client.id}'"><i data-lucide="MessageSquare" size="16"></i></button>`;
                
                const tierBadge = client.tier === 'premium' 
                    ? '<span class="badge badge-primary" style="margin-left: 0.5rem; font-size: 0.65rem;">高级版</span>' 
                    : '<span class="badge badge-secondary" style="margin-left: 0.5rem; font-size: 0.65rem;">AI版</span>';
                
                // 检查是否有新需求
                const clientAnswers = allAnswers[client.id]?.[coachProfileId];
                const hasNewRequest = clientAnswers?.isNew === true;
                const newRequestBadge = hasNewRequest 
                    ? '<span class="badge badge-warning" style="margin-left: 0.5rem; font-size: 0.65rem; animation: pulse 2s infinite;">新需求</span>' 
                    : '';

                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="p-md font-medium">
                        <a href="javascript:void(0)" onclick="openProfile('${client.id}')"
                           style="color: var(--primary-color); text-decoration: none; cursor: pointer; transition: all 0.2s;"
                           onmouseover="this.style.textDecoration='underline'" 
                           onmouseout="this.style.textDecoration='none'">
                            ${client.name}
                        </a>
                        ${tierBadge}
                        ${newRequestBadge}
                    </td>
                    <td class="p-md text-secondary">${planName}</td>
                    <td class="p-md">${planStatusBadge}</td>
                    <td class="p-md text-secondary text-sm">${client.lastActive}</td>
                    <td class="p-md">
                        ${actionButton}
                        ${chatButton}
                    </td>
                </tr>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        // Drawer Logic
        function openPlanEditor(clientId) {
            // 保存到 localStorage，plan-editor 页面会读取这个值
            localStorage.setItem('currentViewingClientId', clientId);
            // 直接跳转到不带参数的 URL，避免 serve 等服务器的重定向问题
            window.location.href = 'plan-editor.html';
        }

        function openProfile(clientId) {
            const drawer = document.getElementById('profile-drawer');
            const overlay = document.getElementById('drawer-overlay');
            
            // 获取当前教练ID
            const currentUser = UserService.getCurrentUser();
            const coachProfileId = currentUser.coachProfileId || currentUser.id;
            
            // 获取学员数据
            const allClients = Store.get('clients') || {};
            const coachClients = allClients[coachProfileId] || [];
            const client = coachClients.find(c => c.id === clientId);
            
            if (client) {
                document.getElementById('drawer-name').textContent = client.name;
                document.getElementById('drawer-avatar').textContent = client.name.charAt(0);
                
                if (client.subscriptionMonths) {
                    const weeks = client.subscriptionMonths * 4;
                    document.getElementById('profile-subscription').textContent = `订阅时长: ${client.subscriptionMonths}个月 (${weeks}周)`;
                }
                
                // 更新订阅等级标签
                const tierBadge = document.getElementById('drawer-tier-badge');
                if (client.tier === 'premium') {
                    tierBadge.innerHTML = '<i data-lucide="Crown"></i> 高级版';
                    tierBadge.style.background = 'linear-gradient(135deg, #e0e7ff 0%, #ddd6fe 100%)';
                } else {
                    tierBadge.innerHTML = '<i data-lucide="Zap"></i> AI版';
                    tierBadge.style.background = 'linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%)';
                }
            }
            
            // 渲染本期需求
            renderServiceRequest(clientId, coachProfileId);
            
            // 渲染学员档案信息
            renderClientProfile(clientId);
            
            drawer.classList.add('open');
            overlay.classList.add('open');
            
            // Initialize chart if not already done
            if (!progressChart) {
                setTimeout(initChart, 300); // Wait for transition
            }
            
            lucide.createIcons();
        }
        
        // 渲染本期需求
        function renderServiceRequest(clientId, coachProfileId) {
            const section = document.getElementById('service-request-section');
            const content = document.getElementById('service-request-content');
            
            const allAnswers = Store.get('subscriptionAnswers') || {};
            const clientAnswers = allAnswers[clientId]?.[coachProfileId];
            
            if (!clientAnswers || !clientAnswers.answers || clientAnswers.answers.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            // 渲染问答
            content.innerHTML = clientAnswers.answers.map((qa, index) => `
                <div style="margin-bottom: var(--spacing-md); padding-bottom: var(--spacing-md); ${index < clientAnswers.answers.length - 1 ? 'border-bottom: 1px dashed #93c5fd;' : ''}">
                    <div style="font-weight: 600; color: #1e40af; font-size: 0.875rem; margin-bottom: 0.25rem;">
                        Q${index + 1}: ${qa.question}
                    </div>
                    <div style="color: #374151; font-size: 0.875rem; padding-left: var(--spacing-sm); background: white; padding: 0.5rem; border-radius: var(--radius-sm);">
                        ${qa.answer}
                    </div>
                </div>
            `).join('');
            
            section.style.display = 'block';
            
            // 标记为已读
            if (clientAnswers.isNew) {
                clientAnswers.isNew = false;
                Store.set('subscriptionAnswers', allAnswers);
                // 重新渲染列表以移除"新需求"徽章
                renderClients();
            }
        }
        
        // 渲染学员档案（公共档案 + 运动卡片 + 时间线）
        function renderClientProfile(clientId) {
            const studentProfiles = Store.get('studentProfiles') || {};
            const studentSnapshot = studentProfiles[clientId];
            const user = UserService.findUserById(clientId);
            const publicProfile = user?.profile;
            
            if (!studentSnapshot && !publicProfile) {
                console.warn('未找到学员档案:', clientId);
                return;
            }
            
            const displayName = studentSnapshot?.displayName || user?.name || '未知学员';
            const avatarText = studentSnapshot?.avatarText || displayName.charAt(0) || '?';
            
            document.getElementById('drawer-avatar').textContent = avatarText;
            document.getElementById('drawer-name').textContent = displayName;
            
            const tierBadge = document.getElementById('drawer-tier-badge');
            if (tierBadge) {
                tierBadge.innerHTML = `<i data-lucide="Crown"></i> ${studentSnapshot?.subscriptionTier || '标准版'}`;
            }
            
            renderPublicArchive('profile-info-container', publicProfile);
            renderProfileTimeline(studentSnapshot);
            renderCoachNotes(studentSnapshot);
            
            lucide.createIcons();
        }
        
        function renderPublicArchive(containerId, publicProfile) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (!publicProfile) {
                container.innerHTML = `
                    <div class="text-center py-lg text-secondary">
                        <i data-lucide="FileText" size="48" style="opacity: 0.4; margin-bottom: 1rem;"></i>
                        <p>学员尚未完善公共档案</p>
                        <p class="text-sm mt-sm">提醒学员在学员端填写个人档案</p>
                    </div>
                `;
                return;
            }
            
            const baseInfoItems = [
                { label: '年龄', value: publicProfile.age ? publicProfile.age + '岁' : '未填写' },
                { label: '性别', value: publicProfile.gender || '未填写' },
                { label: '身高', value: publicProfile.height ? publicProfile.height + ' cm' : '未填写' },
                { label: '体重', value: publicProfile.weight ? publicProfile.weight + ' kg' : '未填写' },
                { label: '生活作息', value: publicProfile.lifestyle || '未填写' }
            ];
            
            const baseInfoHtml = `
                <h3 class="font-semibold mb-sm" style="color: var(--text-secondary); font-size: 0.875rem;">基础信息</h3>
                <div class="info-grid">
                    ${baseInfoItems.map(item => `
                        <div class="info-item">
                            <div class="info-label">${item.label}</div>
                            <div class="info-value" style="${item.label === '生活作息' ? 'font-size:0.875rem;' : ''}">${item.value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            const injuriesHtml = publicProfile.injuries && publicProfile.injuries.length > 0 ? `
                <h3 class="font-semibold mb-sm mt-lg" style="color: var(--text-secondary); font-size: 0.875rem;">伤病史</h3>
                <div class="flex flex-wrap gap-sm">
                    ${publicProfile.injuries.map(injury => `
                        <span style="padding: 0.375rem 0.75rem; background: #fef2f2; color: #dc2626; border-radius: var(--radius-full); font-size: 0.875rem; border: 1px solid #fecaca;">
                            ⚠️ ${injury}
                        </span>
                    `).join('')}
                </div>
            ` : '';
            
            const cardsHtml = renderSportCardsFromProfile(publicProfile);
            
            container.innerHTML = baseInfoHtml + injuriesHtml + cardsHtml;
        }
        
        function renderSportCardsFromProfile(profile) {
            if (!profile.activeCards || profile.activeCards.length === 0) {
                return `
                    <div class="mt-lg p-md text-center text-secondary" style="border: 2px dashed var(--border-color); border-radius: var(--radius-md);">
                        <i data-lucide="Dumbbell" size="32" style="opacity: 0.4; margin-bottom: 0.5rem;"></i>
                        <p>暂无运动数据卡片</p>
                        <p class="text-xs mt-xs">提示学员在学员端补充运动数据</p>
                    </div>
                `;
            }
            
            let cardsHtml = '<h3 class="font-semibold mb-sm mt-lg" style="color: var(--text-secondary); font-size: 0.875rem;">运动数据卡片</h3>';
            
            profile.activeCards.forEach(cardType => {
                const cardData = profile.cardData?.[cardType];
                if (!cardData) return;
                
                if (cardType === 'powerlifting') {
                    const total = (cardData.squat || 0) + (cardData.bench || 0) + (cardData.deadlift || 0);
                    cardsHtml += `
                        <div class="mb-md p-md" style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-radius: var(--radius-lg); border: 1px solid #86efac;">
                            <div class="flex items-center gap-sm mb-md">
                                <span style="font-size: 1.5rem;">🏋️</span>
                                <span class="font-bold text-lg" style="color: #166534;">力量举</span>
                            </div>
                            <div class="info-grid">
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">深蹲 1RM</div>
                                    <div class="info-value" style="color: rgb(16, 185, 129);">${cardData.squat ? cardData.squat + ' kg' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">卧推 1RM</div>
                                    <div class="info-value" style="color: rgb(236, 72, 153);">${cardData.bench ? cardData.bench + ' kg' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">硬拉 1RM</div>
                                    <div class="info-value" style="color: rgb(249, 115, 22);">${cardData.deadlift ? cardData.deadlift + ' kg' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">总和</div>
                                    <div class="info-value" style="color: rgb(99, 102, 241);">${total ? total + ' kg' : '未填写'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (cardType === 'bodybuilding') {
                    cardsHtml += `
                        <div class="mb-md p-md" style="background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%); border-radius: var(--radius-lg); border: 1px solid #e879f9;">
                            <div class="flex items-center gap-sm mb-md">
                                <span style="font-size: 1.5rem;">💪</span>
                                <span class="font-bold text-lg" style="color: #86198f;">健美/形体</span>
                            </div>
                            <div class="info-grid">
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">胸围</div>
                                    <div class="info-value">${cardData.chest ? cardData.chest + ' cm' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">臂围</div>
                                    <div class="info-value">${cardData.arm ? cardData.arm + ' cm' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">腰围</div>
                                    <div class="info-value">${cardData.waist ? cardData.waist + ' cm' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">体脂率</div>
                                    <div class="info-value">${cardData.bodyFat ? cardData.bodyFat + '%' : '未填写'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (cardType === 'generalFitness') {
                    cardsHtml += `
                        <div class="mb-md p-md" style="background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-radius: var(--radius-lg); border: 1px solid #93c5fd;">
                            <div class="flex items-center gap-sm mb-md">
                                <span style="font-size: 1.5rem;">🏃</span>
                                <span class="font-bold text-lg" style="color: #1e40af;">一般体能</span>
                            </div>
                            <div class="info-grid">
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">引体向上</div>
                                    <div class="info-value">${cardData.pullups ? cardData.pullups + ' 个' : '未填写'}</div>
                                </div>
                                <div class="info-item" style="background: white;">
                                    <div class="info-label">静态心率</div>
                                    <div class="info-value">${cardData.restingHR ? cardData.restingHR + ' bpm' : '未填写'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            
            return cardsHtml;
        }
        
        // 渲染进步时间线
        function renderProfileTimeline(studentSnapshot) {
            const container = document.getElementById('profile-timeline-container');
            if (!container) return;
            
            if (!studentSnapshot || !studentSnapshot.timeline || studentSnapshot.timeline.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-secondary py-lg">
                        <i data-lucide="Award" class="w-12 h-12 mx-auto mb-md opacity-30"></i>
                        <p>暂无进步记录</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="timeline">
                    ${studentSnapshot.timeline.map(item => `
                        <div class="timeline-item">
                            <div class="timeline-header">
                                <div>
                                    <div class="timeline-exercise">${item.exercise}</div>
                                    <div class="timeline-date">${item.date}</div>
                                </div>
                            </div>
                            
                            <div class="timeline-stats">
                                ${item.stats.map((stat, idx) => `
                                    <div class="timeline-stat">
                                        <i data-lucide="${idx === 0 ? 'Weight' : 'Zap'}"></i>
                                        <span>${stat}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            ${item.videoThumbnail ? `
                                <div class="timeline-video" onclick="playVideo('${item.videoUrl || ''}')">
                                    <img src="${item.videoThumbnail}" alt="${item.exercise} Video">
                                    <div class="timeline-video-overlay">
                                        <div class="timeline-video-play">
                                            <i data-lucide="Play"></i>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            ${item.note ? `
                                <div class="timeline-note">
                                    <strong>我的感受:</strong> ${item.note}
                                </div>
                            ` : ''}
                            
                            ${item.coachComment ? `
                                <div class="timeline-coach-comment">
                                    <div class="timeline-coach-comment-header">
                                        <i data-lucide="MessageSquare"></i>
                                        我的点评
                                    </div>
                                    <div>${item.coachComment}</div>
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // 渲染教练观察与建议
        function renderCoachNotes(studentSnapshot) {
            const container = document.getElementById('profile-coach-notes-container');
            if (!container) return;
            
            if (!studentSnapshot || !studentSnapshot.coachNotes || studentSnapshot.coachNotes.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-secondary py-lg">
                        <i data-lucide="Eye" class="w-12 h-12 mx-auto mb-md opacity-30"></i>
                        <p>暂无教练观察记录</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="coach-notes-content">
                    ${studentSnapshot.coachNotes.map((note, idx) => `
                        <p${idx > 0 ? ' class="mt-sm"' : ''}><strong>${note.title || note.label}:</strong> ${note.content}</p>
                    `).join('')}
                </div>
            `;
        }

        function closeProfile() {
            const drawer = document.getElementById('profile-drawer');
            const overlay = document.getElementById('drawer-overlay');
            
            drawer.classList.remove('open');
            overlay.classList.remove('open');
        }

        // Chart Logic
        let progressChart;
        const chartData = {
            weight: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [78, 77.5, 77, 76.5, 76, 75.5, 75.2, 75],
                label: '体重 (kg)',
                color: 'rgb(99, 102, 241)'
            },
            bench: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [85, 87, 89, 91, 93, 95, 98, 100],
                label: '卧推1RM (kg)',
                color: 'rgb(236, 72, 153)'
            },
            squat: {
                labels: ['10/1', '10/8', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19'],
                data: [100, 102, 105, 108, 110, 113, 117, 120],
                label: '深蹲1RM (kg)',
                color: 'rgb(16, 185, 129)'
            }
        };

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const data = chartData.weight;
            
            progressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: data.label,
                        data: data.data,
                        borderColor: data.color,
                        backgroundColor: data.color + '20',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: data.color,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' kg';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                 callback: function(value) {
                                    return value + ' kg';
                                }
                            }
                        }
                    }
                }
            });
        }

        function switchChart(type) {
            // Update tab states
            document.querySelectorAll('.chart-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update chart data
            const data = chartData[type];
            progressChart.data.labels = data.labels;
            progressChart.data.datasets[0].label = data.label;
            progressChart.data.datasets[0].data = data.data;
            progressChart.data.datasets[0].borderColor = data.color;
            progressChart.data.datasets[0].backgroundColor = data.color + '20';
            progressChart.data.datasets[0].pointBackgroundColor = data.color;
            progressChart.update();
        }

        function playVideo(videoId) {
            alert(`播放视频: ${videoId}\n(实际应用中会打开全屏视频播放器)`);
        }
    </script>
</body>
</html>
