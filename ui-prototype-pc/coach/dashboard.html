<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachLink - 教练工作台</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-header" id="header"></header>
            <div class="page-content">
                
                <!-- Dashboard Stats -->
                <div class="flex gap-md mb-lg">
                    <div class="card flex-1 p-md">
                        <div class="text-secondary text-sm mb-xs">活跃学员</div>
                        <div class="text-2xl font-bold">12</div>
                        <div class="text-success text-sm flex items-center gap-xs mt-xs">
                            <i data-lucide="TrendingUp" size="14"></i> +2 本周
                        </div>
                    </div>
                    <div class="card flex-1 p-md">
                        <div class="text-secondary text-sm mb-xs">待处理计划</div>
                        <div class="text-2xl font-bold">3</div>
                        <div class="text-warning text-sm mt-xs">需要尽快处理</div>
                    </div>
                    <div class="card flex-1 p-md">
                        <div class="text-secondary text-sm mb-xs">本月收入</div>
                        <div class="text-2xl font-bold">¥ 8,500</div>
                        <div class="text-secondary text-sm mt-xs">较上月 +15%</div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-lg font-semibold">最近动态</h3>
                        <button class="btn btn-secondary text-sm">查看全部</button>
                    </div>
                    <div class="card-body">
                        <ul class="flex flex-col gap-md">
                            <li class="flex items-center justify-between border-b border-gray-100 pb-sm">
                                <div class="flex items-center gap-md">
                                    <div class="avatar bg-blue-100 text-blue-600">李</div>
                                    <div>
                                        <div class="font-medium">李同学 完成了训练打卡</div>
                                        <div class="text-sm text-secondary">增肌计划 A - 第 3 周 / 第 2 天</div>
                                    </div>
                                </div>
                                <span class="text-sm text-secondary">10分钟前</span>
                            </li>
                            <li class="flex items-center justify-between border-b border-gray-100 pb-sm">
                                <div class="flex items-center gap-md">
                                    <div class="avatar bg-green-100 text-green-600">王</div>
                                    <div>
                                        <div class="font-medium">王小明 提交了新的动作视频</div>
                                        <div class="text-sm text-secondary">深蹲 - 100kg x 5</div>
                                    </div>
                                </div>
                                <button class="btn btn-primary text-sm">去点评</button>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/mock_data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
