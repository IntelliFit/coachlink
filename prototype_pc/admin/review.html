<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩审核 - CoachLink Admin</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        
        <main class="main-content">
            <header class="top-header" id="header"></header>
            <div class="page-content">
                
                <div class="flex justify-between items-center mb-lg">
                    <div>
                        <h1 class="text-2xl font-bold">成绩审核</h1>
                        <p class="text-secondary mt-xs">审核学员提交的排行榜成绩</p>
                    </div>
                    <div class="flex items-center gap-md">
                        <span class="badge badge-warning" id="pending-count">0</span>
                        <select id="leaderboard-filter" class="p-sm border border-gray-300 rounded" onchange="filterLeaderboard()">
                            <option value="">全部项目</option>
                        </select>
                    </div>
                </div>

                <!-- Pending Submissions -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="font-semibold">待审核记录</h3>
                    </div>
                    <div id="pending-submissions-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Recently Reviewed -->
                <div class="card mt-lg">
                    <div class="card-header">
                        <h3 class="font-semibold">最近审核记录</h3>
                    </div>
                    <div id="reviewed-submissions-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Video Preview Modal -->
    <div id="video-modal" class="modal" style="display: none;" onclick="closeVideoModal()">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 800px;">
            <div class="flex justify-between items-center mb-md">
                <h3 class="font-semibold">训练视频</h3>
                <button onclick="closeVideoModal()" class="text-secondary hover:text-primary">
                    <i data-lucide="X" size="20"></i>
                </button>
            </div>
            <div id="video-container" class="bg-dark rounded" style="aspect-ratio: 16/9;">
                <!-- Video player or link -->
            </div>
        </div>
    </div>

    <script src="../js/mock_data.js"></script>
    <script src="../js/leaderboard_config.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        let currentFilter = '';

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            populateLeaderboardFilter();
            renderPendingSubmissions();
            renderReviewedSubmissions();
        });

        function populateLeaderboardFilter() {
            const select = document.getElementById('leaderboard-filter');
            const leaderboards = getAllLeaderboards();
            
            leaderboards.forEach(lb => {
                const option = document.createElement('option');
                option.value = lb.id;
                option.textContent = lb.title;
                select.appendChild(option);
            });
        }

        function filterLeaderboard() {
            currentFilter = document.getElementById('leaderboard-filter').value;
            renderPendingSubmissions();
            renderReviewedSubmissions();
        }

        function renderPendingSubmissions() {
            const container = document.getElementById('pending-submissions-list');
            const submissions = Store.get('submissions') || [];
            let pendingSubmissions = submissions.filter(s => s.status === 'pending');
            
            if (currentFilter) {
                pendingSubmissions = pendingSubmissions.filter(s => s.leaderboardId === currentFilter);
            }
            
            document.getElementById('pending-count').textContent = `${pendingSubmissions.length} 待审核`;
            
            if (pendingSubmissions.length === 0) {
                container.innerHTML = `
                    <div class="p-lg text-center text-secondary">
                        <i data-lucide="CheckCircle" size="48" style="opacity: 0.3;"></i>
                        <p class="mt-md">暂无待审核记录</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            container.innerHTML = pendingSubmissions.map(sub => {
                const config = getLeaderboardConfig(sub.leaderboardId);
                return `
                    <div class="p-md" style="border-bottom: 1px solid var(--color-border);">
                        <div class="flex justify-between items-start">
                            <div class="flex items-start gap-md flex-1">
                                <i data-lucide="${config.icon}" size="32" class="text-primary mt-xs"></i>
                                <div class="flex-1">
                                    <div class="flex items-center gap-sm mb-xs">
                                        <span class="font-semibold text-lg">${config.title}</span>
                                        <span class="badge badge-sm">${config.type === 'weight' ? '重量' : config.type === 'reps' ? '次数' : '时间'}</span>
                                    </div>
                                    <div class="text-sm text-secondary mb-sm">
                                        提交者: <span class="font-medium">${sub.userName}</span> · 
                                        ${formatDate(sub.timestamp)}
                                    </div>
                                    <div class="flex gap-md flex-wrap">
                                        ${Object.entries(sub.details).map(([key, value]) => {
                                            if (key === 'videoUrl') return '';
                                            const field = config.formFields.find(f => f.name === key);
                                            if (!field) return '';
                                            return `<div><span class="text-secondary">${field.label}:</span> <span class="font-medium">${value}</span></div>`;
                                        }).join('')}
                                    </div>
                                    <div class="mt-sm">
                                        <span class="text-primary font-semibold text-lg">成绩: ${formatScore(sub, config)}</span>
                                    </div>
                                    ${sub.videoUrl ? `
                                        <button class="btn btn-sm btn-secondary mt-sm" onclick="openVideoModal('${sub.videoUrl}')">
                                            <i data-lucide="Video" size="14"></i>
                                            查看视频
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="flex gap-sm">
                                <button class="btn btn-success btn-sm" onclick="approveSubmission('${sub.id}')">
                                    <i data-lucide="Check" size="14"></i>
                                    通过
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="rejectSubmission('${sub.id}')">
                                    <i data-lucide="X" size="14"></i>
                                    拒绝
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function renderReviewedSubmissions() {
            const container = document.getElementById('reviewed-submissions-list');
            const submissions = Store.get('submissions') || [];
            let reviewedSubmissions = submissions.filter(s => s.status !== 'pending');
            
            if (currentFilter) {
                reviewedSubmissions = reviewedSubmissions.filter(s => s.leaderboardId === currentFilter);
            }
            
            reviewedSubmissions.sort((a, b) => (b.reviewedAt || 0) - (a.reviewedAt || 0));
            reviewedSubmissions = reviewedSubmissions.slice(0, 10); // Show only latest 10
            
            if (reviewedSubmissions.length === 0) {
                container.innerHTML = `
                    <div class="p-lg text-center text-secondary">
                        <p>暂无审核记录</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = reviewedSubmissions.map(sub => {
                const config = getLeaderboardConfig(sub.leaderboardId);
                const statusBadge = sub.status === 'approved' ? 
                    '<span class="badge badge-success">已通过</span>' : 
                    '<span class="badge badge-danger">已拒绝</span>';
                
                return `
                    <div class="p-md flex justify-between items-center" style="border-bottom: 1px solid var(--color-border);">
                        <div class="flex items-center gap-md flex-1">
                            <i data-lucide="${config.icon}" size="24" class="text-primary"></i>
                            <div class="flex-1">
                                <div class="flex items-center gap-sm">
                                    <span class="font-semibold">${config.title}</span>
                                    <span class="text-secondary">·</span>
                                    <span>${sub.userName}</span>
                                    <span class="text-secondary">·</span>
                                    <span class="text-primary font-medium">${formatScore(sub, config)}</span>
                                </div>
                                <div class="text-xs text-secondary mt-xs">
                                    审核于 ${formatDate(sub.reviewedAt)}
                                </div>
                            </div>
                        </div>
                        <div>
                            ${statusBadge}
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function approveSubmission(submissionId) {
            if (!confirm('确认通过此成绩？通过后将显示在排行榜上。')) return;
            
            const submissions = Store.get('submissions') || [];
            const submission = submissions.find(s => s.id === submissionId);
            
            if (submission) {
                submission.status = 'approved';
                submission.reviewedAt = Date.now();
                submission.reviewerId = MockData.currentUser.id;
                submission.reviewerName = MockData.currentUser.name;
                Store.set('submissions', submissions);
                
                renderPendingSubmissions();
                renderReviewedSubmissions();
                showToast('成绩已通过');
            }
        }

        function rejectSubmission(submissionId) {
            if (!confirm('确认拒绝此成绩？')) return;
            
            const submissions = Store.get('submissions') || [];
            const submission = submissions.find(s => s.id === submissionId);
            
            if (submission) {
                submission.status = 'rejected';
                submission.reviewedAt = Date.now();
                submission.reviewerId = MockData.currentUser.id;
                submission.reviewerName = MockData.currentUser.name;
                Store.set('submissions', submissions);
                   
                renderPendingSubmissions();
                renderReviewedSubmissions();
                showToast('成绩已拒绝', 'error');
            }
        }

        function openVideoModal(videoUrl) {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('video-container');
            
            container.innerHTML = `
                <div class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <i data-lucide="Video" size="64" class="text-white opacity-50 mx-auto"></i>
                        <p class="text-white mt-md">视频链接</p>
                        <a href="${videoUrl}" target="_blank" class="text-blue-300 hover:underline mt-sm block">${videoUrl}</a>
                        <p class="text-white text-sm mt-sm opacity-70">点击链接在新标签页中查看</p>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function closeVideoModal() {
            document.getElementById('video-modal').style.display = 'none';
        }

        function formatScore(submission, config) {
            if (config.type === 'weight') {
                if (submission.details.weight !== undefined) {
                    const totalWeight = submission.details.bodyweight + submission.details.weight;
                    return `${totalWeight} ${config.unit} (${submission.details.weight}kg负重)`;
                }
                return `${submission.value} ${config.unit}`;
            } else if (config.type === 'reps') {
                return `${submission.value} 次`;
            } else if (config.type === 'time') {
                return `${submission.value} 秒`;
            }
            return submission.value + ' ' + (config.unit || '');
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        function showToast(message, type = 'success') {
            alert(message);
        }
    </script>

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            width: 90%;
        }
        .bg-dark {
            background: #1a1a1a;
        }
    </style>
</body>
</html>
